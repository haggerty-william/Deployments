kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: database-api
  namespace: first-trust-easl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-api
  template:
    metadata:
      labels:
        app: database-api
    spec:
      containers:
        - name: database-api
          image: ghcr.io/easltech/database-api:v1.3.6
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: PdxDbServer
              value: ftea2peasldb.ftea2peasldb.private.mysql.database.azure.com
            - name: PdxDbUser
              valueFrom:
                secretKeyRef:
                  name: dblogin
                  key: user
            - name: PdxDbPassword
              valueFrom:
                secretKeyRef:
                  name: dblogin
                  key: password
            - name: PdxLogApiAddress
              value: http://logging-api/Log
            - name: PdxLogFilepath
              value: /app/log/db-api-.log
            - name: PdxLogExclusionExpression
              value: (StartsWith(SourceContext, 'System.Net.Http.HttpClient.') or StartsWith(SourceContext, 'Serilog.') or StartsWith(SourceContext, 'Microsoft.')) and @l = 'Information'
            - name: PdxAppType
              value: api
            - name: PdxAppName
              value: database-api
            - name: PdxNodeName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: PdxPodName
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PdxNamespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PdxPodIP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /_health
              port: 5000
              scheme: HTTP
            timeoutSeconds: 5
            periodSeconds: 900
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred
