apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edx-api
  namespace: first-trust-easl
spec:
  selector:
    matchLabels:
      app: edx-api
  template:
    metadata:
      labels:
        app: edx-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: edx-api
          image: ghcr.io/easltech/edx-api:v3.2.1
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
          - name: ASPNETCORE_URLS
            value: http://+:5000
          - name: PdxAppName
            value: "edx-api"
          - name: PdxAppType
            value: "edx"
          - name: PdxDbApiAddress
            value: "http://database-api"
          - name: PdxLogFilepath
            value: /app/log/edx-api-.log
          - name: PdxLogExclusionExpression
            value: (StartsWith(SourceContext, 'System.Net.Http.HttpClient.') or StartsWith(SourceContext, 'Serilog.') or StartsWith(SourceContext, 'Microsoft.')) and @l = 'Information'
          - name: PdxNodeName
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: PdxPodName
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: PdxNamespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: PdxPodIP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP