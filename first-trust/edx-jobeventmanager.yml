apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edx-jobeventmanager
  namespace: first-trust-easl
spec:
  selector:
    matchLabels:
      app: edx-jobeventmanager
  template:
    metadata:
      labels:
        app: edx-jobeventmanager
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: edx-jobeventmanager
          image: ghcr.io/easltech/edx-jobeventmanager:v3.1.0
          env:
          - name: PdxAppName
            value: "edx-jobeventmanager"
          - name: PdxAppType
            value: "edx"
          - name: PdxDbApiAddress
            value: http://database-api
          - name: PdxLogApiAddress
            value: http://logging-api/Log
          - name: PdxLogFilepath
            value: /app/log/edx-jobeventmanager-.log
          - name: PdxLogExclusionExpression
            value: (StartsWith(SourceContext, 'System.Net.Http.HttpClient.') or StartsWith(SourceContext, 'Serilog.') or StartsWith(SourceContext, 'Microsoft.')) and @l = 'Information'
          - name: PdxNodeName
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: PdxPodName
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: PdxNamespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: PdxPodIP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /_health
              port: 5000
              scheme: HTTP
            timeoutSeconds: 5
            periodSeconds: 900
            successThreshold: 1
            failureThreshold: 3