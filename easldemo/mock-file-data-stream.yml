kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: mock-data-file-stream
  namespace: easl-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-data-file-stream
  template:
    metadata:
      labels:
        app: mock-data-file-stream
    spec:
      containers:
        - name: mock-data-file-stream
          image: ghcr.io/easltech/mock-data-file-stream:v1.0.2
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: PdxAppName
              value: mock-data-file-stream
            - name: PdxAppType
              value: edx
            - name: PdxDbApiAddress
              value: http://database-api
            - name: PdxLogApiAddress
              value: http://logging-api/Log
            - name: PdxConfigLogUpdate
              value: 'false'
            - name: PdxLogFilepath
              value: /app/log/edx-mock-data-file-stream-.log
            - name: PdxNodeName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: PdxPodName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: PdxNamespace
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: PdxPodIP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
          resources:
            limits:
              cpu: '2'
              memory: 1Gi
            requests:
              cpu: '1'
              memory: 256Mi
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred