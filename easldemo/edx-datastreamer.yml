apiVersion: apps/v1
kind: Deployment
metadata:
  name: edx-datastreamer
  namespace: easl-demo
spec:
  selector:
    matchLabels:
      app: edx-datastreamer
  template:
    metadata:
      labels:
        app: edx-datastreamer
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: edx-datastreamer
          image: ghcr.io/easltech/edx-datastreamer:v2.0.6-datastream
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 256Mi
              cpu: "0.2"
          env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Development"
          - name: PdxAppName
            value: "edx-datastreamer"
          - name: PdxAppType
            value: "edx"
          - name: PdxClientGroup
            value: "easl-demo"
          - name: PdxDbApiAddress
            value: "http://database-api"
          - name: PdxLogApiAddress
            value: "http://logging-api/Log"
          - name: PdxConfigLogUpdate
            value: "true"
          - name: PdxNodeName
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: PdxPodName
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: PdxNamespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: PdxPodIP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PdxServiceAccountName
            valueFrom:
              fieldRef:
                fieldPath: spec.serviceAccountName