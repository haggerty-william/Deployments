kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: edx-filemanager
  namespace: bbirdai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edx-filemanager
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: edx-filemanager
    spec:
      containers:
        - name: edx-filemanager
          image: ghcr.io/easltech/edx-filemanager:v1.1.18.1
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Release
            - name: PdxAppName
              value: edx-filemanager
            - name: PdxAppType
              value: edx
            - name: PdxClientGroup
              value: bbirdai
            - name: PdxLogApiAddress
              value: http://logging-api/Log
            - name: PdxDbApiAddress
              value: http://database-api
            - name: PdxConfigLogUpdate
              value: 'true'
            - name: PdxNodeName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: PdxPodName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: PdxNamespace
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: PdxPodIP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: PdxServiceAccountName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /_health
              port: 5000
              scheme: HTTP
            timeoutSeconds: 5
            periodSeconds: 900
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: regcred
  updateStrategy:
    type: RollingUpdate
