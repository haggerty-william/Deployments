kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: edx-exporter
  namespace: bbirdai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edx-exporter
  template:
    metadata:
      labels:
        app: edx-exporter
    spec:
      hostAliases:
      - ip: "10.7.0.20"
        hostnames:
        - "prodceph.easltech.com"
      containers:
        - name: edx-exporter
          image: ghcr.io/easltech/edx-exporter:v3.2.1.2
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: PdxAppName
              value: edx-exporter
            - name: PdxAppType
              value: edx
            - name: PdxDbApiAddress
              value: http://database-api
            - name: PdxLogApiAddress
              value: http://logging-api/Log
            - name: PdxLogFilepath
              value: /app/log/edx-exporter-.log
            - name: PdxLogExclusionExpression
              value: (StartsWith(SourceContext, 'System.Net.Http.HttpClient.') or StartsWith(SourceContext, 'Serilog.') or StartsWith(SourceContext, 'Microsoft.')) and @l = 'Information'
            - name: PdxNodeName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: PdxPodName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: PdxNamespace
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: PdxPodIP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: PdxServiceAccountName
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
          resources:
            limits:
              cpu: '8'
              memory: 4Gi
            requests:
              cpu: '1'
              memory: 2Gi
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /_health
              port: 5000
              scheme: HTTP
            timeoutSeconds: 5
            periodSeconds: 900
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      serviceAccountName: bbirdai-service-discovery-account
      imagePullSecrets:
        - name: regcred
