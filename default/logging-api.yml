kind: Deployment
apiVersion: apps/v1
metadata:
  name: logging-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-api
  template:
    metadata:
      labels:
        app: logging-api
    spec:
      containers:
        - name: logging-api
          image: ghcr.io/phoeniqstech/logging-api:v1.0.4
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:5000
            - name: PdxAppName
              value: logging-api
            - name: PdxAppType
              value: logging
            - name: PdxClientGroup
              value: default
            - name: PdxDbApiAddress
              value: http://database-api
            - name: PdxConfigLogUpdate
              value: 'true'
            - name: PdxNodeName
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PdxPodName
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PdxNamespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PdxPodIP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PdxServiceAccountName
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName

---
apiVersion: v1
kind: Service
metadata:
  name: logging-api
  namespace: default
spec:
  ports:
    - name: http
      port: 6060
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
  selector:
    app: logging-api