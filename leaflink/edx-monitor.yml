apiVersion: apps/v1
kind: Deployment
metadata:
  name: edx-monitor
  namespace: leaflink
spec:
  selector:
    matchLabels:
      app: edx-monitor
  template:
    metadata:
      labels:
        app: edx-monitor
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: edx-monitor
          image: ghcr.io/easltech/edx-monitor:v1.0.2
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 256Mi
              cpu: "0.2"
          env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Release"
          - name: PdxAppName
            value: "edx-monitor"
          - name: PdxAppType
            value: "edx"
          - name: PdxClientGroup
            value: "leaflink"
          - name: PdxLogApiAddress
            value: http://logging-api/Log
          - name: PdxConfigLogUpdate
            value: "true"
          - name: PdxDbServer
            value: mysql-internal.mysql
          - name: PdxDbUser
            valueFrom:
              secretKeyRef:
                 name: dblogin
                 key: user
          - name: PdxDbPassword
            valueFrom:
              secretKeyRef:
                name: dblogin
                key: password
          - name: PdxNodeName
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: PdxPodName
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: PdxNamespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: PdxPodIP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP