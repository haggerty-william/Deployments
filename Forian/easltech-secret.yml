apiVersion: v1
data:
  tls.crt: 
  tls.chained.crt: 
  tls.key: 
kind: Secret
metadata:
  name: easltech-cert
  namespace: default
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  labels:
    name: traefik-config
  namespace: default
data:
  dyn.yaml: |
    # https://doc.traefik.io/traefik/https/tls/
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: '/certs/tls.chained.crt'
            keyFile: '/certs/tls.key'

---
