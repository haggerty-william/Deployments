apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard-service
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.1.38
  ports:
    - port: 8080
      targetPort: dashboard
  selector:
    app: traefik
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-web-service
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.1.38
  ports:
    - targetPort: web
      port: 80
      name: http
    - targetPort: websecure
      port: 443
      name: https
  selector:
    app: traefik